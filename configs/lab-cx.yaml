# lab-cx example config — pass with: lab-cx proxy --config configs/lab-cx.yaml
#
# This file controls which components run and in what order, purely by NAME. It folds
# onto a base `preset`, then applies the overrides below. Unknown top-level keys are a
# hard error (strict). Any key you omit falls back to the preset/defaults.
#
# ── HOW TO ADD A NEW COMPONENT (one-line config, no core edit needed) ───────────────
#   • new ENCODER  : register it in internal/reduce/actions.go `allEncoders`
#                    (unique name + rank), then list its name under `reduce.encoders`.
#   • new REDUCER  : register it via reduce.RegisterReducer (its Reducer.Name), then
#                    list that name under `reduce.reducers`.
#   • new EXTRACT STRATEGY : add it to internal/extract `RunExtraction`'s switch +
#                    `rawStrategyOrder`, then list its name under `extract.strategies`.
#   • new COMPACTOR : implement engine.Compactor, register it by name (Engine.Register),
#                    then list its name under `compactors`.
# Each list is referenced by NAME; enabling/disabling/ordering is pure config.
# An empty or omitted list means "use all built-in defaults".
# ─────────────────────────────────────────────────────────────────────────────────────

preset: balanced                  # base defaults: safe|balanced|aggressive|cache|coding|mcp

# Which compactors run, in order. Built-ins: reduce, extract, summarize, truncate, cache.
# extract runs before reduce so it sees large structured tool outputs intact.
compactors: [extract, reduce, cache]

reduce:
  protect_recent: 2               # keep the N most recent turns at full fidelity
  provable_only: true             # never drop merely-predicted-unused content
  # Enabled reducers, by Reducer.Name. Built-ins: collapse, skeleton, format.
  reducers: [collapse, skeleton, format]
  cmd_filter: true                # dedup/trim noisy shell command output
  # Format re-encoders, by name — this list also sets PRIORITY (first listed wins ties).
  encoders: [json_compact, toon, jsonl, markdown_kv, tsv, csv]

extract:
  enabled: true                   # cheap-model projection of large structured outputs
  mode: auto                      # auto | single | rlm | deterministic
  strategies: [code, single, rlm, deterministic]
  floor: 3000                     # token floor before extraction is considered
  # Model transport + credentials (read by the proxy; --extract-* flags override these).
  # source: config (default) uses the model/credentials below; source: incoming reuses
  # the proxied request's OWN model + credentials (no static client needed).
  source: config                  # config | incoming
  provider: anthropic             # anthropic | openai
  model: claude-haiku-4-5
  auth: x-api-key                 # x-api-key | bearer (bearer for gateway endpoints)
  # base: https://gateway.example/v1   # optional: override the model base URL
  # api_key: sk-...                     # optional inline key (prefer key_env for hygiene)
  key_env: LABCX_EXTRACT_KEY            # env var holding the key (default fallbacks apply)

# LLM trajectory summarization (off unless listed in `compactors` AND enabled here).
# Replaces older messages with one factual summary, keeping the last keep_last verbatim.
summarize:
  enabled: false
  level: regular                  # concise | regular | highly_detailed
  keep_last: 3                    # recent messages kept verbatim after the summary
  trigger_tokens: 8000            # skip summarizing below this whole-conversation size
  source: config                  # same transport mechanism as extract (config|incoming)
  provider: anthropic
  model: claude-haiku-4-5
  auth: x-api-key
  key_env: LABCX_SUMMARIZE_KEY

# Naive truncation baseline (no model): keep the last keep_last messages, drop the rest.
truncate:
  enabled: false
  keep_last: 6
  trigger_tokens: 8000

cache:
  enabled: true
  breakpoints: 4                  # ephemeral cache_control breakpoints on the stable prefix
