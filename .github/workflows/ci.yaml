name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: Lint
        run: make lint
      - name: Test & coverage
        run: |
          make cover
          # Accurate cross-package total (statement-weighted) → PR/run job summary + log.
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "### Test coverage: ${total} (cross-package, statement-weighted)" >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${total}"
      - name: Per-package coverage (log)
        run: go test -cover ./... | sed 's/[[:space:]]\+/ /g'
      - name: Build
        run: make build

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
