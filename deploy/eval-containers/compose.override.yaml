# Drop-in override that inserts lab-cx BEFORE the eval-containers gateway, so it sees
# exactly what the agent sends (native protocol, pre model-name rewrite) and controls
# the context before it reaches the gateway:
#
#   runner (agent) ──▶ lab-cx ──▶ gateway ──▶ provider
#
# Usage (from an eval-containers benchmark dir):
#   docker compose -f compose.yaml -f /path/to/this/compose.override.yaml up ...
#
# It repoints the runner's *_BASE_URL at lab-cx and points lab-cx at the gateway.
# Nothing about the agent images or the gateway changes. For the AFTER-gateway
# placement instead, see README.md in this directory.

services:
  lab-cx:
    image: ghcr.io/kagenti/lab-context-engineering:latest
    # Run our components: reduce + cache (preset balanced) AND the cheap-model extractor.
    # The extractor calls claude-haiku-4-5 back THROUGH the gateway's /anthropic route
    # using the same sk-proxy credential the agent holds (x-api-key) — no real key here,
    # no new egress. Summarize/truncate are intentionally NOT enabled for these runs.
    command:
      - "proxy"
      - "--addr"
      - ":8080"
      - "--preset"
      - "balanced"
      - "--upstream"
      - "http://gateway:4000"
      - "--extract-model"
      - "claude-haiku-4-5"
      - "--extract-base"
      - "http://gateway:4000/anthropic"
      - "--extract-auth"
      - "x-api-key"
    environment:
      LABCX_EXTRACT_KEY: sk-proxy
    networks:
      - internal

  runner:
    environment:
      # Route the agent through lab-cx; it forwards the (full, prefixed) path to the
      # gateway. Suffix routing means /anthropic/v1/messages etc. are still reduced.
      ANTHROPIC_BASE_URL: http://lab-cx:8080/anthropic
      OPENAI_BASE_URL: http://lab-cx:8080/openai/v1
      GOOGLE_GEMINI_BASE_URL: http://lab-cx:8080/genai
    depends_on:
      - lab-cx
